- data_flow_id: msc-it-100
  data_flow_group: A1
  source_system: RegionalCDC-US
  source_format: cloudFiles
  source_details:
    source_database: APP
    source_table: CUSTOMERS_US
    source_path_it: '{uc_volume_path}/integration_tests/resources/data/multi_source_cdc/customers_us'
    source_schema_path: '{uc_volume_path}/integration_tests/resources/data/multi_source_cdc/ddl/customers_us.ddl'
  bronze_catalog_it: '{uc_catalog_name}'
  bronze_database_it: '{bronze_schema}'
  bronze_table: customers_us_cdc
  bronze_reader_options:
    cloudFiles.format: json
    cloudFiles.inferColumnTypes: 'true'
    cloudFiles.rescuedDataColumn: _rescued_data
  bronze_table_properties:
    pipelines.autoOptimize.managed: 'true'

